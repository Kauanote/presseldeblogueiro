<style>
  :root {
    --verde: #25d366;
    --verde-escuro: #128c4a;
    --fundo: #f3f6f4;
    --texto: #1b2420;
    --texto-suave: #5d6b64;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--fundo);
    color: var(--texto);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
  }
  main {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  /* Foto com borda verde estilo status do WhatsApp */
  .status {
    width: 148px;
    height: 148px;
    margin: 0 auto 22px;
    padding: 5px;
    border-radius: 50%;
    background: conic-gradient(var(--verde) 0 31%, transparent 31% 33%,
                               var(--verde) 33% 64%, transparent 64% 66%,
                               var(--verde) 66% 97%, transparent 97% 100%);
  }
  .status .anel {
    width: 100%;
    height: 100%;
    padding: 4px;
    border-radius: 50%;
    background: var(--fundo);
  }
  .status img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: #d8dfdb;
  }

  h1 {
    font-size: 1.55rem;
    line-height: 1.25;
    margin-bottom: 10px;
  }
  .msg {
    font-size: 1.1rem;
    line-height: 1.6;
    color: var(--texto);
    margin-bottom: 28px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 17px 20px;
    border-radius: 999px;
    background: var(--verde);
    color: #fff;
    font-size: 1.12rem;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 6px 18px rgba(37, 211, 102, .38);
    transition: background .15s, transform .15s;
  }
  .btn:hover { background: var(--verde-escuro); }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 3px solid var(--verde-escuro); outline-offset: 3px; }
  .btn svg { width: 24px; height: 24px; fill: #fff; flex-shrink: 0; }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
